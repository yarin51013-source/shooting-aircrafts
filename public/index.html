<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Air Combat</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061522;color:#fff;font:14px Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh;background:#071522;cursor:crosshair}
.hud{position:fixed;top:12px;padding:10px 14px;background:#061321e8;border:1px solid #315b78;border-radius:12px;line-height:1.65;z-index:5;pointer-events:none}
.left{left:12px}.right{right:12px;text-align:right}.tip{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:5;white-space:nowrap;text-shadow:0 2px 5px #000}
#gameOver{position:fixed;inset:0;display:none;place-items:center;background:#000b;z-index:10}.box{background:#071522;border:1px solid #46708b;border-radius:18px;padding:32px;text-align:center}button{background:#168ce0;color:white;border:0;border-radius:10px;padding:12px 26px;font-weight:bold;cursor:pointer}
</style></head><body>
<canvas id="game"></canvas>
<div class="hud left">❤️ HP <b id="hp">100</b><br>⚡ SPEED <b id="speed">0</b> · ALT <b id="alt">1200</b><br>🔫 AMMO <b id="ammo">100</b> · 🚀 MISSILES <b id="missiles">4</b></div>
<div class="hud right">🏆 SCORE <b id="score">0</b><br><b id="effect">READY</b></div>
<div class="tip">WASD / ARROWS fly · MOUSE aim · HOLD CLICK fire · M missile · R reload</div>
<div id="gameOver"><div class="box"><h1>SHOT DOWN</h1><p>Score: <b id="finalScore">0</b></p><button id="restart">RESTART</button></div></div>
<script>
(function(){
"use strict";
var canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
var W=0,H=0,dpr=1,keys={},mouse={x:0,y:0,down:false},player,enemies=[],bullets=[],powerups=[],particles=[];
var score=0,spawnTimer=.5,powerTimer=4,fireCooldown=0,dead=false,last=0,shake=0;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
function resize(){W=window.innerWidth;H=window.innerHeight;dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(W*dpr));canvas.height=Math.max(1,Math.floor(H*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);if(mouse.x===0)mouse.x=W/2;if(mouse.y===0)mouse.y=H/2}
function reset(){player={x:W/2,y:H/2,vx:0,vy:0,angle:0,hp:100,ammo:100,missiles:4,rapid:0,explosive:0,shield:0};enemies=[];bullets=[];powerups=[];particles=[];score=0;spawnTimer=.5;powerTimer=4;fireCooldown=0;dead=false;shake=0;document.getElementById("gameOver").style.display="none"}
function spawnEnemy(){var side=Math.floor(Math.random()*4),x,y;if(side===0){x=-70;y=Math.random()*H}else if(side===1){x=W+70;y=Math.random()*H}else if(side===2){x=Math.random()*W;y=-70}else{x=Math.random()*W;y=H+70}enemies.push({x:x,y:y,hp:60,maxHp:60,angle:0,speed:55+Math.random()*35,shot:1+Math.random()*2})}
function spawnPower(){var types=["REPAIR","RAPID","EXPLOSIVE","MISSILES","SHIELD"];powerups.push({x:80+Math.random()*Math.max(80,W-160),y:90+Math.random()*Math.max(80,H-180),type:types[Math.floor(Math.random()*types.length)],life:15,spin:0})}
function particlesAt(x,y,n,color){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=40+Math.random()*180;particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.3+Math.random()*.6,color:color})}}
function shoot(){if(dead||player.ammo<=0||fireCooldown>0)return;player.ammo--;fireCooldown=player.rapid>0?.045:.11;var a=player.angle;bullets.push({x:player.x+Math.cos(a)*28,y:player.y+Math.sin(a)*28,vx:Math.cos(a)*780,vy:Math.sin(a)*780,life:1.2,damage:player.explosive>0?30:20,enemy:false,missile:false});particlesAt(player.x+Math.cos(a)*28,player.y+Math.sin(a)*28,3,"#dff")}
function missile(){if(dead||player.missiles<=0)return;var target=null,best=Infinity;for(var i=0;i<enemies.length;i++){if(enemies[i].hp<=0)continue;var d=dist(player,enemies[i]);if(d<best){best=d;target=enemies[i]}}if(!target)return;player.missiles--;var a=Math.atan2(target.y-player.y,target.x-player.x);bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*430,vy:Math.sin(a)*430,life:4,damage:100,enemy:false,missile:true,target:target})}
function enemyShoot(e){var a=Math.atan2(player.y-e.y,player.x-e.x);bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,life:3,damage:12,enemy:true,missile:false})}
function collectPower(x){if(x.type==="REPAIR")player.hp=clamp(player.hp+35,0,100);if(x.type==="RAPID")player.rapid=8;if(x.type==="EXPLOSIVE")player.explosive=8;if(x.type==="MISSILES")player.missiles+=3;if(x.type==="SHIELD")player.shield=7;particlesAt(x.x,x.y,20,"#ffd45a")}
function update(dt){
if(dead)return;
fireCooldown=Math.max(0,fireCooldown-dt);player.rapid=Math.max(0,player.rapid-dt);player.explosive=Math.max(0,player.explosive-dt);player.shield=Math.max(0,player.shield-dt);shake=Math.max(0,shake-dt);
var ax=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ay=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
player.vx+=(ax*460-player.vx)*dt*4.5;player.vy+=(ay*460-player.vy)*dt*4.5;player.x=clamp(player.x+player.vx*dt,30,W-30);player.y=clamp(player.y+player.vy*dt,65,H-45);
var targetAngle=Math.atan2(mouse.y-player.y,mouse.x-player.x),delta=Math.atan2(Math.sin(targetAngle-player.angle),Math.cos(targetAngle-player.angle));player.angle+=clamp(delta,-dt*7,dt*7);if(mouse.down)shoot();
spawnTimer-=dt;if(spawnTimer<=0){spawnEnemy();spawnTimer=.65+Math.random()*.75}powerTimer-=dt;if(powerTimer<=0&&powerups.length<4){spawnPower();powerTimer=6+Math.random()*5}
for(var i=0;i<enemies.length;i++){var e=enemies[i],a=Math.atan2(player.y-e.y,player.x-e.x),turn=Math.atan2(Math.sin(a-e.angle),Math.cos(a-e.angle));e.angle+=clamp(turn,-dt*3,dt*3);e.x+=Math.cos(e.angle)*e.speed*dt;e.y+=Math.sin(e.angle)*e.speed*dt;e.shot-=dt;if(e.shot<=0){enemyShoot(e);e.shot=1.2+Math.random()*1.4}if(dist(e,player)<30){if(player.shield<=0)player.hp-=25*dt;e.hp=0;particlesAt(e.x,e.y,18,"#ff5544");shake=.25}}
for(var j=0;j<bullets.length;j++){var b=bullets[j];
if(b.missile&&b.target&&b.target.hp>0){var aa=Math.atan2(b.target.y-b.y,b.target.x-b.x),cur=Math.atan2(b.vy,b.vx),dd=Math.atan2(Math.sin(aa-cur),Math.cos(aa-cur)),na=cur+clamp(dd,-dt*3,dt*3);b.vx=Math.cos(na)*440;b.vy=Math.sin(na)*440}
b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
if(b.enemy&&dist(b,player)<22){b.life=0;if(player.shield<=0){player.hp-=b.damage;shake=.15;particlesAt(player.x,player.y,5,"#ff6666")}}
if(!b.enemy){for(var z=0;z<enemies.length;z++){var en=enemies[z];if(en.hp>0&&dist(b,en)<23){b.life=0;en.hp-=b.damage;particlesAt(b.x,b.y,7,"#ffd45a");if(player.explosive>0){for(var q=0;q<enemies.length;q++)if(q!==z&&dist(en,enemies[q])<85)enemies[q].hp-=10}if(en.hp<=0){score+=100;particlesAt(en.x,en.y,24,"#ff8b45")}break}}}}
enemies=enemies.filter(function(e){return e.hp>0&&e.x>-150&&e.x<W+150&&e.y>-150&&e.y<H+150});
bullets=bullets.filter(function(b){return b.life>0&&!b.hit});
for(var pidx=0;pidx<powerups.length;pidx++){var pu=powerups[pidx];pu.life-=dt;pu.spin+=dt*4;if(dist(pu,player)<34){collectPower(pu);pu.life=0}}
powerups=powerups.filter(function(x){return x.life>0});
for(var f=0;f<particles.length;f++){var pt=particles[f];pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vx*=.97;pt.vy*=.97;pt.life-=dt}
particles=particles.filter(function(x){return x.life>0});
if(player.hp<=0){dead=true;document.getElementById("finalScore").textContent=score;document.getElementById("gameOver").style.display="grid"}
}
function drawPlane(q,color,angle){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(angle);ctx.shadowBlur=18;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(32,0);ctx.lineTo(5,-5);ctx.lineTo(-17,-24);ctx.lineTo(-10,-5);ctx.lineTo(-25,-11);ctx.lineTo(-19,0);ctx.lineTo(-25,11);ctx.lineTo(-10,5);ctx.lineTo(-17,24);ctx.lineTo(5,5);ctx.closePath();ctx.fill();ctx.fillStyle="#bfeaff";ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-7,-5);ctx.lineTo(-13,0);ctx.lineTo(-7,5);ctx.closePath();ctx.fill();ctx.restore()}
function draw(){
ctx.save();if(shake)ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
ctx.fillStyle="#071522";ctx.fillRect(0,0,W,H);
var grad=ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,Math.max(W,H)*.8);grad.addColorStop(0,"#163550");grad.addColorStop(1,"#06111d");ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
ctx.strokeStyle="#ffffff12";for(var x=0;x<W;x+=70){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(var y=0;y<H;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
for(var i=0;i<enemies.length;i++){var e=enemies[i];ctx.fillStyle="#0009";ctx.fillRect(e.x-25,e.y-38,50,6);ctx.fillStyle="#ff5555";ctx.fillRect(e.x-25,e.y-38,50*clamp(e.hp/e.maxHp,0,1),6);drawPlane(e,"#e33",e.angle)}
for(var pidx=0;pidx<powerups.length;pidx++){var pu=powerups[pidx],col=pu.type==="REPAIR"?"#35e27a":pu.type==="RAPID"?"#ffd34d":pu.type==="EXPLOSIVE"?"#ff7048":pu.type==="MISSILES"?"#c47dff":"#58dcff";ctx.save();ctx.translate(pu.x,pu.y);ctx.rotate(pu.spin);ctx.shadowBlur=22;ctx.shadowColor=col;ctx.strokeStyle=col;ctx.lineWidth=3;ctx.strokeRect(-16,-16,32,32);ctx.fillStyle=col;ctx.font="bold 17px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(pu.type==="REPAIR"?"+":pu.type==="RAPID"?"⚡":pu.type==="EXPLOSIVE"?"✦":pu.type==="MISSILES"?"🚀":"◉",0,0);ctx.restore()}
for(var b=0;b<bullets.length;b++){var bl=bullets[b];ctx.save();ctx.fillStyle=bl.missile?"#ff8a20":"#fff";ctx.shadowBlur=12;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(bl.x,bl.y,bl.missile?5:3,0,Math.PI*2);ctx.fill();ctx.restore()}
for(var f=0;f<particles.length;f++){var pp=particles[f];ctx.globalAlpha=clamp(pp.life,0,1);ctx.fillStyle=pp.color;ctx.beginPath();ctx.arc(pp.x,pp.y,2+pp.life*3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
drawPlane(player,"#168ce0",player.angle);
ctx.fillStyle="#000b";ctx.fillRect(player.x-32,player.y-46,64,7);ctx.fillStyle=player.hp>35?"#35e27a":"#f44";ctx.fillRect(player.x-32,player.y-46,64*clamp(player.hp/100,0,1),7);
if(player.shield>0){ctx.strokeStyle="#58dcff";ctx.lineWidth=3;ctx.shadowBlur=15;ctx.shadowColor="#58dcff";ctx.beginPath();ctx.arc(player.x,player.y,43,0,Math.PI*2);ctx.stroke()}
ctx.restore();
ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(mouse.x,mouse.y,13,0,Math.PI*2);ctx.moveTo(mouse.x-22,mouse.y);ctx.lineTo(mouse.x-7,mouse.y);ctx.moveTo(mouse.x+7,mouse.y);ctx.lineTo(mouse.x+22,mouse.y);ctx.moveTo(mouse.x,mouse.y-22);ctx.lineTo(mouse.x,mouse.y-7);ctx.moveTo(mouse.x,mouse.y+7);ctx.lineTo(mouse.x,mouse.y+22);ctx.stroke();
document.getElementById("hp").textContent=Math.max(0,Math.round(player.hp));document.getElementById("speed").textContent=Math.round(Math.sqrt(player.vx*player.vx+player.vy*player.vy));document.getElementById("alt").textContent=Math.round(1200-player.y*.35);document.getElementById("ammo").textContent=player.ammo;document.getElementById("missiles").textContent=player.missiles;document.getElementById("score").textContent=score;
var fx=[];if(player.rapid>0)fx.push("RAPID "+player.rapid.toFixed(1));if(player.explosive>0)fx.push("EXPLOSIVE "+player.explosive.toFixed(1));if(player.shield>0)fx.push("SHIELD "+player.shield.toFixed(1));document.getElementById("effect").textContent=fx.length?fx.join(" · "):"READY";
}
window.addEventListener("resize",resize);
window.addEventListener("keydown",function(e){keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==="m")missile();if(e.key.toLowerCase()==="r"&&player)player.ammo=100});
window.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false});
window.addEventListener("mousemove",function(e){mouse.x=e.clientX;mouse.y=e.clientY});
window.addEventListener("mousedown",function(e){if(e.button===0)mouse.down=true});
window.addEventListener("mouseup",function(e){if(e.button===0)mouse.down=false});
document.getElementById("restart").addEventListener("click",reset);
resize();mouse.x=W/2;mouse.y=H/2;reset();
function loop(now){var dt=last?Math.min(.033,(now-last)/1000):.016;last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script></body></html>

name: Build Windows painting helper

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/joy-of-painting/desktop-helper/joy_paint_helper.py"
      - ".github/workflows/build-joy-paint-helper.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the single build tool
        run: python -m pip install --upgrade pyinstaller
      - name: Build standalone executable
        working-directory: docs/joy-of-painting/desktop-helper
        run: pyinstaller --noconfirm --clean --onefile --console --name JoyPaintHelper joy_paint_helper.py
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "docs/joy-of-painting/desktop-helper/dist/JoyPaintHelper.exe" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "docs/joy-of-painting/desktop-helper/dist/SHA256SUMS.txt" -Value "$hash  JoyPaintHelper.exe"
      - name: Publish latest helper
        uses: softprops/action-gh-release@v2
        with:
          tag_name: helper-latest
          name: Joy of Painting Windows Helper (minimal build)
          make_latest: true
          overwrite_files: true
          files: |
            docs/joy-of-painting/desktop-helper/dist/JoyPaintHelper.exe
            docs/joy-of-painting/desktop-helper/dist/SHA256SUMS.txt

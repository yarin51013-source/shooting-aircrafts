name: Build Windows painting helper

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/joy-of-painting/desktop-helper/**"
      - ".github/workflows/build-joy-paint-helper.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install flask flask-cors pyautogui pynput pyinstaller
      - name: Build standalone executable
        working-directory: docs/joy-of-painting/desktop-helper
        run: pyinstaller --noconfirm --clean --onefile --name JoyPaintHelper --collect-all pynput --collect-all pyautogui --collect-all flask --collect-all flask_cors joy_paint_helper.py
      - name: Publish latest helper
        uses: softprops/action-gh-release@v2
        with:
          tag_name: helper-latest
          name: Joy of Painting Windows Helper
          make_latest: true
          overwrite_files: true
          files: docs/joy-of-painting/desktop-helper/dist/JoyPaintHelper.exe
